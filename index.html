function filterReservasHostRows(){
  let all=demoReservasRows();
  let q=(($('#sideSearch')&&$('#sideSearch').value)||'').trim().toLowerCase();
  let guest=(($('#guestSearch')&&$('#guestSearch').value)||'').trim().toLowerCase();
  let ref=(($('#refSearch')&&$('#refSearch').value)||'').trim().toLowerCase();
  let cat=(($('#resCategoria')&&$('#resCategoria').value)||'(Todos)');
  let pkg=(($('#resPackage')&&$('#resPackage').value)||'(Todos)');
  let canal=(($('#resCanal')&&$('#resCanal').value)||'(Todos)');
  let tipo=(($('#statusFilter')&&$('#statusFilter').value)||'(Todos)');
  let estado=(($('#resEstadoAdic')&&$('#resEstadoAdic').value)||'(Todos)');
  let ciHoje=!!($('#resCiHoje')&&$('#resCiHoje').checked);
  let sem=!!($('#resSemQuarto')&&$('#resSemQuarto').checked);
  let garant=!!($('#resGarantido')&&$('#resGarantido').checked);
  let autoOnly=!!($('#resAutoOnly')&&$('#resAutoOnly').checked);
  let deOn=!!($('#resDeOn')&&$('#resDeOn').checked);
  let ateOn=!!($('#resAteOn')&&$('#resAteOn').checked);
  let deDate=($('#resDeDate')&&$('#resDeDate').value)||'';
  let ateDate=($('#resAteDate')&&$('#resAteDate').value)||'';
  let hotelDay='2026-09-28';
  function toISO(dmy){ if(!dmy) return ''; let p=dmy.split('-'); if(p.length===3&&p[0].length===2) return p[2]+'-'+p[1]+'-'+p[0]; return dmy; }
  let list=all.filter(r=>{
    if(q){ let blob=(r.id+' '+r.name+' '+r.cat+' '+r.channel+' '+r.state+' '+(r.extra||'')+' '+(r.voucher||'')).toLowerCase(); if(blob.indexOf(q)<0) return false; }
    if(guest && (r.name||'').toLowerCase().indexOf(guest)<0) return false;
    if(ref && (r.id||'').toLowerCase().indexOf(ref)<0) return false;
    if(cat && cat!=='(Todos)' && r.cat!==cat) return false;
    if(pkg && pkg!=='(Todos)' && r.pkg!==pkg) return false;
    if(canal && canal!=='(Todos)' && r.channel!==canal) return false;
    if(tipo && tipo!=='(Todos)'){
      if(tipo==='Cancelada'){ if(!r.cancel) return false; }
      else if((r.tipo||r.state||'').toLowerCase()!==tipo.toLowerCase() && !(tipo==='Confirmada'&&r.badge==='Normal'&&!r.cancel)) return false;
    }
    if(estado==='Priority' && !r.priority) return false;
    if(estado==='(Nenhum)' && r.priority) return false;
    if(ciHoje){ if(toISO(r.in)!==hotelDay) return false; }
    if(sem){ if(r.room && r.room!=='—') return false; }
    if(garant && !r.guaranteed) return false;
    if(autoOnly && !r.auto) return false;
    if(deOn && deDate){ if(toISO(r.created||r.in) < deDate) return false; }
    if(ateOn && ateDate){ if(toISO(r.created||r.in) > ateDate) return false; }
    return true;
  });
  let sortBy=(($('#sortBy')&&$('#sortBy').value)||'created');
  list.sort((a,b)=>{
    let ka=a[sortBy]||a.in||a.id, kb=b[sortBy]||b.in||b.id;
    if(ka<kb) return sortAsc?-1:1; if(ka>kb) return sortAsc?1:-1; return 0;
  });
  renderReservasHostRows(list);
  if($('#resHideFilters')&&$('#resHideFilters').checked){ let p=$('#resAdvPanel'); if(p) p.style.display='none'; }
}

function applyHkFilter(tab){
  const rooms=window.__hkRooms||[];
  const sec=document.getElementById('hkSec')?.value||'';
  const andar=document.getElementById('hkAndar')?.value||'';
  const ocup=document.getElementById('hkOcup')?.value||'';
  const rec=document.getElementById('hkRec')?.value||'';
  const todos=document.getElementById('hkTodos')?.value||'';
  const activeTab=tab||document.querySelector('.hk-tab.active')?.dataset.hkTab||'limpo-sujo';
  document.querySelectorAll('.hk-tile').forEach(tile=>{
    const n=tile.dataset.hkRoom;
    const r=rooms.find(x=>x.n===n);
    if(!r){tile.style.display='none';return}
    let ok=true;
    if(sec&&r.sec!==sec)ok=false;
    if(andar!==''&&String(r.andar)!==andar)ok=false;
    if(ocup&&r.ocup!==ocup)ok=false;
    if(rec&&r.rec!==rec)ok=false;
    if(activeTab==='inspeccao'&&!r.insp)ok=false;
    if(activeTab==='manutencao'&&!r.manut)ok=false;
    if(todos==='Só Limpo'&&!r.limpo)ok=false;
    if(todos==='Só Sujo'&&r.limpo)ok=false;
    if(todos==='Com saída'&&r.ocup!=='Saída')ok=false;
    tile.style.display=ok?'':'none';
  });
  document.querySelectorAll('.hk-andar').forEach(block=>{
    const visible=[...block.querySelectorAll('.hk-tile')].some(t=>t.style.display!=='none');
    block.style.display=visible?'':'none';
  });
  document.querySelectorAll('#hkDetailRows tr').forEach(tr=>{
    const n=tr.dataset.hkRoom;
    const r=rooms.find(x=>x.n===n);
    if(!r){tr.style.display='none';return}
    let ok=true;
    if(sec&&r.sec!==sec)ok=false;
    if(andar!==''&&String(r.andar)!==andar)ok=false;
    if(ocup&&r.ocup!==ocup)ok=false;
    if(rec&&r.rec!==rec)ok=false;
    if(activeTab==='inspeccao'&&!r.insp)ok=false;
    if(activeTab==='manutencao'&&!r.manut)ok=false;
    tr.style.display=ok?'':'none';
  });
}

    return `<section class="reports-window"><header class="reports-title">Relatórios</header>${topline}<div class="report-viewer-scroll"><section class="ssrs-params"><div class="ssrs-param-grid">${params.map((p,i)=>`<label class="ssrs-param"><span>${esc(p.label)}:</span>${reportControl(p,i)}</label>`).join('')}</div><div class="ssrs-run"><button type="button" class="ssrs-exibir" data-report-run>Exibir Relatório</button></div></section>${reportSsrsToolbar(reportPreview===true)}${reportPreview=== 'loading'?`<div class="ssrs-empty-preview"><div class="ssrs-loading-box"><div class="ssrs-spinner" aria-hidden="true"></div><div>Carregando...</div><button type="button" class="ssrs-cancel-link" data-report-back>Cancelar</button></div></div>`:reportPreview==='empty'?`<div class="ssrs-empty-preview ssrs-combo-empty"><div class="ssrs-loading-hint">Sem dados para esta combinação de parâmetros (alinhado Host PMS).<br><small>Esta combinação ficou EMPTY no sweep Relatórios Exibir — Abene mostra em branco como o Host.</small><br><small>Pré-visualização local apenas com dados fictícios.</small></div></div>`:reportPreview===true?reportPaper(current,rows,false):`<div class="ssrs-empty-preview"><div class="ssrs-loading-hint">Defina os parâmetros e clique em « Exibir Relatório ».<br><small>A área abaixo mostra o resultado SSRS (barra, grelha, vazio ou carregamento).</small><br><small>Pré-visualização local apenas com dados fictícios.</small></div></div>`}</div>${fecharBar}</section>`;
  }
  if(!reportFolder){
    let folders=reportFolders.filter(f=>!query||`${f.name} ${f.items.join(' ')}`.toLowerCase().includes(query));
    let found=query?reportCatalog.filter(r=>`${r.name} ${r.folder}`.toLowerCase().includes(query)):[];
    return `<section class="reports-window"><header class="reports-title">Relatórios</header>${topline}<div class="report-browser-scroll"><div class="report-folder-grid">${folders.map(f=>`<button type="button" class="report-folder-tile" data-report-folder="${esc(f.name)}"><span class="report-folder-icon" aria-hidden="true"></span><span class="report-folder-name">${esc(f.name)}</span></button>`).join('')}</div>${query?`<h3 class="report-search-heading">Resultados · ${found.length}</h3><div class="report-file-grid">${found.map(r=>`<button type="button" class="report-result" data-report-open="${esc(r.id)}"><span class="report-file-icon" aria-hidden="true"></span><span class="report-file-name">${esc(r.name)}<small>${esc(r.folder)}</small></span></button>`).join('')}</div>`:''}</div>${fecharBar}</section>`;
  }
  let results=reportCatalog.filter(r=>r.folder===reportFolder&&(!query||r.name.toLowerCase().includes(query)));
  return `<section class="reports-window"><header class="reports-title">Relatórios</header>${topline}<div class="report-browser-scroll"><div class="report-file-grid">${results.map(r=>`<button type="button" class="report-result" data-report-open="${esc(r.id)}"><span class="report-file-icon" aria-hidden="true"></span><span class="report-file-name">${esc(r.name)}</span></button>`).join('')||'<p class="report-empty">Nenhum ficheiro neste dossier.</p>'}</div></div>${fecharBar}</section>`;
}
const genericModuleBody=moduleBody;moduleBody=function(page){return page==='Relatórios'?reportsBody():genericModuleBody(page)};
document.addEventListener('input',e=>{if(e.target.id==='reportSearch'){reportSearchQuery=e.target.value;let q=reportSearchQuery.toLowerCase();document.querySelectorAll('.report-folder-tile').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q));document.querySelectorAll('.report-result').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))}});
document.addEventListener('click',e=>{let f=e.target.closest('[data-report-folder]'),r=e.target.closest('[data-report-open]');if(f){reportFolder=f.dataset.reportFolder;reportCurrent=null;reportSearchQuery='';renderAll()}else if(r){document.querySelectorAll(".report-result.is-selected").forEach(x=>x.classList.remove("is-selected"));r.classList.add("is-selected");reportCurrent=r.dataset.reportOpen;reportPreview=false;renderAll()}else if(e.target.closest('[data-report-folder-crumb]')){reportCurrent=null;reportPreview=false;reportFolder=e.target.closest('[data-report-folder-crumb]').dataset.reportFolderCrumb;renderAll()}else if(e.target.closest('[data-report-home]')){if(reportCurrent){reportCurrent=null;reportPreview=false}else reportFolder='';renderAll()}else if(e.target.closest('[data-report-clear]')){reportSearchQuery='';renderAll()}else if(e.target.closest('[data-report-back]')){let p=document.querySelector('.ssrs-param-grid');if(p)p.hidden=!p.hidden}else if(e.target.closest('[data-report-run]')){reportPreview='loading';renderAll();setTimeout(()=>{let cur=reportCatalog.find(x=>x.id===reportCurrent);reportPreview=reportShouldDisplay(cur)?true:'empty';renderAll()},450)}else if(e.target.closest('[data-report-export]')){let cur=reportCatalog.find(x=>x.id===reportCurrent),lay=reportDemoLayout(cur||{folder:'',name:''}),rows=lay.rows,csv=[lay.cols.join(';'),...rows.map(x=>x.join(';'))].join('\r\n'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='relatorio-demonstracao.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV fictício exportado.')}else if(e.target.closest('[data-report-print]'))toast('Impressão disponible après la pré-visualisation fictive.')});
init();







</script>
</body></html>
