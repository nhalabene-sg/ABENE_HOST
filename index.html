tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="ssrs-demo-note">Aperçu local fictif · aucune donnée du PMS copiée.</p></div>`:`<div class="ssrs-empty-preview">Choisissez les paramètres puis sélectionnez « Exibir Relatório ».</div>`}</div><footer class="report-catalog-footer">${esc(current.id)} · Aperçu local <button data-report-home>Retour au catalogue</button></footer></section>`}if(!reportFolder){let folders=reportFolders.filter(f=>!query||`${f.name} ${f.items.join(' ')}`.toLowerCase().includes(query));let found=query?reportCatalog.filter(r=>`${r.name} ${r.folder}`.toLowerCase().includes(query)):[];return `<section class="reports-window"><header class="reports-title">Relatórios <small>Reporting Services · catalogue de démonstration</small></header>${search}<div class="report-browser-scroll"><div class="report-browser-head">Dossiers de rapports <label><input type="checkbox"> Open new window</label></div><div class="report-folder-grid">${folders.map(f=>`<button class="report-folder-tile" data-report-folder="${esc(f.name)}"><span class="report-folder-icon">📁</span>${esc(f.name)}<small>${f.items.length} rapport(s)</small></button>`).join('')}</div>${query?`<h3 class="report-search-heading">Résultats · ${found.length}</h3><div class="report-file-list">${found.map(r=>`<button class="report-result" data-report-open="${esc(r.id)}">▤ ${esc(r.name)} <small>${esc(r.folder)}</small></button>`).join('')}</div>`:''}</div><footer class="report-catalog-footer">${reportCatalog.length} rapports · ${reportFolders.length} dossiers <span>Données fictives</span></footer></section>`}let files=reportFolders.find(f=>f.name===reportFolder)?.items||[];let results=reportCatalog.filter(r=>r.folder===reportFolder&&(!query||r.name.toLowerCase().includes(query)));return `<section class="reports-window"><header class="reports-title">Relatórios <small>${esc(reportFolder)}</small></header>${search}<div class="report-browser-scroll"><div class="report-browser-head">${esc(reportFolder)} · ${results.length} fichiers</div><div class="report-file-list">${results.map(r=>`<button class="report-result" data-report-open="${esc(r.id)}"><span>▤</span><strong>${esc(r.name)}</strong><small>Ouvrir ›</small></button>`).join('')||'<p>Aucun fichier dans ce dossier.</p>'}</div></div><footer class="report-catalog-footer">${files.length} fichiers · démonstration</footer></section>`}
const genericModuleBody=moduleBody;moduleBody=function(page){return page==='Relatórios'?reportsBody():genericModuleBody(page)};
document.addEventListener('input',e=>{if(e.target.id==='reportSearch'){reportSearchQuery=e.target.value;let q=reportSearchQuery.toLowerCase();document.querySelectorAll('.report-folder-tile').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q));document.querySelectorAll('.report-result').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))}});
document.addEventListener('click',e=>{let f=e.target.closest('[data-report-folder]'),r=e.target.closest('[data-report-open]');if(f){reportFolder=f.dataset.reportFolder;reportCurrent=null;reportSearchQuery='';renderAll()}else if(r){reportCurrent=r.dataset.reportOpen;reportPreview=false;renderAll()}else if(e.target.closest('[data-report-home]')){if(reportCurrent){reportCurrent=null;reportPreview=false}else reportFolder='';renderAll()}else if(e.target.closest('[data-report-clear]')){reportSearchQuery='';renderAll()}else if(e.target.closest('[data-report-back]')){let p=document.querySelector('.ssrs-param-grid');if(p)p.hidden=!p.hidden}else if(e.target.closest('[data-report-run]')){reportPreview=true;renderAll()}else if(e.target.closest('[data-report-export]')){let rows=reportDemoRows(),csv=['Referência;Quarto;Hóspede demo;Tipologia;Data;Estado;Valor demo',...rows.map(x=>x.join(';'))].join('\r\n'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='relatorio-demonstracao.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV fictício exportado.')}else if(e.target.closest('[data-report-print]'))toast('Impressão disponible après la pré-visualisation fictive.')});

/* Dedicated Reservations search window, based on the user's capture and the read-only PMS screen. */
let rsExecuted=false,rsFilters={},rsPage=0,rsSelected='',rsView='Detalhado',rsHideFilters=false,rsSaved=[];
const rsEscape=s=>esc(String(s??''));
function rsControl(label,key,kind='text',options=[],attrs=''){let value=rsFilters[key]??'';if(kind==='checkbox')return `<label class="rs-check"><input type="checkbox" data-rs-field="${key}" ${value?'checked':''} ${attrs}><span>${label}</span></label>`;if(kind==='radio')return `<label class="rs-radio"><input type="radio" name="${key}" data-rs-field="${key}" value="${options[0]}" ${value===options[0]?'checked':''}><span>${options[0]}</span></label>`;let control=kind==='select'?`<select data-rs-field="${key}" ${attrs}>${options.map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input data-rs-field="${key}" type="${kind}" value="${rsEscape(value)}" ${attrs}>`;return `<label class="rs-field"><span>${label}</span>${control}</label>`}
function rsReadFilters(){let out={};document.querySelectorAll('.rs-screen [data-rs-field]').forEach(x=>{out[x.dataset.rsField]=x.type==='checkbox'?x.checked:x.value});document.querySelectorAll('.rs-screen [data-rs-enable]').forEach(x=>{out[x.dataset.rsEnable+'_on']=x.checked});return out}
function rsIsoDate(v){let p=String(v||'').split('-');return p.length===3&&p[0].length===2?`${p[2]}-${p[1]}-${p[0]}`:String(v||'')}
function rsDateToggle(label,key,defaultDate){let on=Boolean(rsFilters[key+'_on']),v=rsFilters[key]??defaultDate;return `<div class="rs-date-toggle"><input type="checkbox" data-rs-enable="${key}" ${on?'checked':''}><span>${label}</span><select disabled><option>Criação</option><option>Estadia</option></select><input type="date" data-rs-field="${key}" value="${rsEscape(v)}" ${on?'':'disabled'}><input type="time" value="${key==='createdTo'?'23:59':'00:00'}" ${on?'':'disabled'}></div>`}
function rsRows(){if(!rsExecuted)return[];let f=rsFilters,all=(db.reservations||[]).map(r=>({...r})),contains=(v,q)=>!q||String(v??'').toLowerCase().includes(String(q).toLowerCase());all=all.filter(r=>contains([r.id,r.name,r.room,r.type,r.in,r.out,r.state].join(' '),f.free)&&contains(r.name,f.guest)&&contains(r.id,f.ref)&&contains(r.room,f.room)&&(!f.category||f.category==='(Todos)'||f.category==='Duplo Pequeno'&&contains(r.type,'Duplo')||contains(r.type,f.category))&&(!f.type||f.type==='(Todos)'||f.type==='Normal'&&!['Pendente','Check-out','Cancelada'].includes(r.state)||f.type!=='Normal'&&contains(r.state,f.type))&&(!f.checkin_on||rsIsoDate(r.in)===f.checkin)&&(!f.checkout_on||rsIsoDate(r.out)===f.checkout));if(f.onlyAuto)all=all.filter(r=>String(r.id).includes('DEMO'));if(rsSelected&&!all.some(r=>r.id===rsSelected))rsSelected='';return all}
function reservationsSearchBody(){let options=['(Todos)','Normal','Residentes','Opção','Lista Espera','Pendente','Cancelamento','No show','Check-In','Check-Out'],rows=rsRows(),visible=rows.slice(rsPage*25,(rsPage+1)*25),first=`<section class="rs-col rs-first"><div class="rs-first-pair"><div>${rsControl('Pesquisa livre:','free')}${rsControl('Hóspede:','guest')}<div class="rs-inline">${rsControl('','members','select',['(outros membros:)'])}${rsControl('','memberSearch')}</div>${rsControl('Nº Reserva:','ref')}${rsControl('Incluir hóspedes adicionais','additional','checkbox')}${rsDateToggle('De','createdFrom','2026-09-26')}${rsDateToggle('Até','createdTo','2026-09-26')}</div><div class="rs-date-state"><label><input type="radio" name="rsRange" checked> Fixo</label><label><input type="radio" name="rsRange"> Periodo</label>${rsDateToggle('Check-In','checkin','2026-09-26')}${rsDateToggle('Check-Out','checkout','2026-09-26')}${rsControl('TipoReserva:','type','select',options)}${rsControl('Check-In Hoje','today','checkbox')}${rsControl('Estado Adicional:','extraState','select',['(Todos)','VIP','Pendente','Garantido'])}</div></div></section>`,second=`<section class="rs-col">${rsControl('Categoria:','category','select',['(Todos)','Easy Mobility','Duplo Pequeno','Double Standard','Twin Standard','Triple','Family Room','Queen Deluxe','King Deluxe','Standard with Balcony'])}${rsControl('Upg. de:','upgrade','select',['(Todos)','Duplo Pequeno','Double Standard','Twin Standard'])}<div class="rs-inline">${rsControl('Quarto:','room')}<span>sem:</span>${rsControl('','withoutRoom','checkbox')}</div>${rsControl('Package:','package','select',['(Todos)','Alojamento','Alojamento e PA','Bed & Breakfast'])}${rsControl('Lista Preços:','priceList','select',['(Todos)','RACK','Online NR'])}${rsControl('Allotment:','allotment','select',['(Todos)','(nenhum)'])}</section>`,third=`<section class="rs-col">${rsControl('Segmento:','segment','select',['(Todos)','Lazer','Negócios','Grupo'])}${rsControl('Sub-Segmento:','subsegment','select',['(Todos)','Individual','Empresa','Grupo'])}${rsControl('Canal de Dist.:','distribution','select',['(Todos)','Direto','Booking','Hey!Travel'])}<div class="rs-inline">${rsControl('Garantido','guaranteed','checkbox')}${rsControl('','guaranteeValue','select',['(Todos)'],'disabled')}</div>${rsControl('Voucher:','voucher')}${rsControl('Tipo de oferta:','offer','select',['(Todos)','Oferta','Pacote'])}</section>`,fourth=`<section class="rs-col rs-last">${rsControl('Canal online:','online','select',['(Todos)','Booking','Hey!Travel'])}${rsControl('Rate Code:','rate','select',['(Todos)','RACK','Online NR'])}${rsControl('Apenas reservas automáticas','onlyAuto','checkbox')}${rsControl('Atualização automática','autoUpdate','checkbox','', 'disabled')}<button class="toolbtn" data-rs-action="print">▣ Imprimir</button><div class="rs-search-buttons"><button class="toolbtn primary" data-rs-action="search">⟳ Pesquisar</button><button class="toolbtn" data-rs-action="auto">◎ Auto</button></div>${rsControl('Modo Visualização:','view','select',['Detalhado','Resumo','Compacto'])}${rsControl('Ocultar filtros após pesquisa','hide','checkbox')}</section>`;
let table=visible.length?visible.map((r,i)=>`<tr data-rs-row="${rsEscape(r.id)}" class="${r.id===rsSelected?'selected':''}"><td>PMS</td><td><button class="rs-open" data-rs-open="${rsEscape(r.id)}">Abrir</button></td><td>${rsEscape(r.id)} · ${rsEscape(r.type)} · ${rsEscape(r.room)}</td><td>${rsEscape(r.name)}</td><td>${rsEscape(r.in)} → ${rsEscape(r.out)} · ${rsEscape(r.state)}</td><td>${Number(r.amount||0).toFixed(2)} €</td></tr>`).join(''):`<tr><td colspan="6" class="rs-empty">${rsExecuted?'Não foram encontrados dados.':'Nenhum registo pesquisado.'}</td></tr>`;
return `<div class="rs-screen"><div class="rs-headbar"><label>Hotel: <select><option>PMS</option></select></label><span class="rs-search-presets">Pesquisas: <select data-rs-action="saved"><option>(Nova pesquisa)</option>${rsSaved.map((x,i)=>`<option value="${i}">${rsEscape(x.name)}</option>`).join('')}</select><button data-rs-action="save">⊕</button><button disabled>Apagar</button></span><button class="rs-advanced-toggle">Pesquisa Avançada ⌃</button></div>${rsHideFilters?'<div class="rs-showfilters"><button class="toolbtn" data-rs-action="showfilters">Mostrar filtros</button></div>':`<div class="rs-filters">${first}${second}${third}${fourth}</div>`}<div class="rs-table"><table class="grid"><thead><tr><th>Hotel</th><th>Ações</th><th>Resumo</th><th>Entidades</th><th>Informações</th><th>Pagamento</th></tr></thead><tbody>${table}</tbody></table></div><div class="rs-paging"><label>Ordenar: <select><option>Data de criação</option><option>Check-In</option><option>Nome</option></select> <select><option>Z-A</option><option>A-Z</option></select></label><label>Nº registos a visualizar: <select><option>25</option><option>50</option><option>100</option></select></label><span>Página ${rows.length?rsPage+1:0} de ${rows.length?Math.ceil(rows.length/25):0}</span><span class="spacer"></span>${rows.length} registos</div><div class="window-bottom rs-bottom"><button class="actionbtn primary" data-action="new-res-full">▣ Nova reserva</button><button class="actionbtn" disabled>Copiar reserva</button><button class="actionbtn" data-rs-action="functions">⚙ Funções ▾</button><button class="actionbtn" data-rs-action="rooms">⇄ Mudanças de Quartos</button><button class="actionbtn" data-rs-action="assign">▤ Atribuição rápida de quartos</button><span class="grow"></span><button class="bottom-close" data-close="Reservas">Fechar</button></div></div>`}
const rsPreviousModuleBody=moduleBody;moduleBody=function(page){if(page==='Reservas')return reservationsSearchBody();return rsPreviousModuleBody(page)};
document.addEventListener('click',e=>{if(active!=='Reservas')return;let b=e.target.closest('[data-rs-action]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();let act=b.dataset.rsAction;if(act==='search'||act==='auto'){rsFilters=rsReadFilters();rsExecuted=true;rsPage=0;renderAll()}else if(act==='save'){rsSaved.push({name:`Pesquisa ${rsSaved.length+1}`,filters:rsReadFilters()});renderAll();toast('Pesquisa local de demonstração guardada.')}else if(act==='saved'){let x=rsSaved[Number(b.value)];if(x){rsFilters=x.filters;rsExecuted=true;renderAll()}}else if(act==='showfilters'){rsHideFilters=false;renderAll()}else if(act==='print')window.print();else if(act==='functions')toast('Funções disponíveis na simulação: abrir, copiar ou exportar dados fictícios.');else if(act==='rooms'||act==='assign')toast('Ação de quartos disponível uniquement sur les données fictives de la maquette.');},true);
document.addEventListener('click',e=>{if(active!=='Reservas')return;let row=e.target.closest('[data-rs-row]'),open=e.target.closest('[data-rs-open]');if(open){e.preventDefault();rsSelected=open.dataset.rsOpen;toast('Réservation fictive sélectionnée.');return}if(row){rsSelected=row.dataset.rsRow;row.closest('tbody').querySelectorAll('tr').forEach(x=>x.classList.toggle('selected',x===row))}let hide=e.target.closest('.rs-field [data-rs-field="hide"]');if(hide){rsHideFilters=hide.checked;renderAll()}},true);
document.addEventListener('change',e=>{if(active!=='Reservas')return;if(e.target.dataset.rsField==='view'){rsView=e.target.value;rsFilters.view=rsView;document.querySelector('.rs-table')?.classList.toggle('rs-summary',rsView==='Resumo');document.querySelector('.rs-table')?.classList.toggle('rs-compact',rsView==='Compacto')}if(e.target.dataset.rsAction==='saved'){let x=rsSaved[Number(e.target.value)];if(x){rsFilters=x.filters;rsExecuted=true;renderAll()}}if(e.target.dataset.rsField==='hide'){rsHideFilters=e.target.checked;renderAll()}},true);
